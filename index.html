<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UnderLight MIDI Palette & Brightness Controller</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background: #f0f2f5; color: #333; }
        .container { max-width: 650px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #1a73e8; border-bottom: 2px solid #e8f0fe; padding-bottom: 10px; }
        label { display: block; font-weight: bold; margin-top: 15px; margin-bottom: 5px; font-size: 0.9em; }
        select, button, input[type="range"] { width: 100%; box-sizing: border-box; }
        select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        
        /* Brightness Section */
        .brightness-ctrl { display: flex; gap: 10px; align-items: center; margin-top: 5px; }
        #bright-range { flex: 1; cursor: pointer; }
        #bright-val { width: 40px; font-weight: bold; text-align: center; color: #1a73e8; }
        .btn-small { width: 100px; padding: 10px; margin-top: 0; background: #34a853; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;}
        .btn-small:hover { background: #2d9249; }

        .file-upload-wrapper { position: relative; width: 100%; }
        #file-input { display: none; }
        .custom-file-upload {
            display: block; width: 100%; padding: 12px; background: #fff;
            border: 1px solid #ddd; border-radius: 8px; text-align: center;
            cursor: pointer; box-sizing: border-box; color: #666; transition: 0.2s;
        }
        .custom-file-upload:hover { background: #f8f9fa; border-color: #1a73e8; color: #1a73e8; }
        
        button#upload-btn { background: #1a73e8; color: white; font-weight: bold; border: none; padding: 12px; border-radius: 8px; margin-top: 20px; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        button#upload-btn:hover { background: #1557b0; }
        button#upload-btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; margin-top: 15px; background: #ddd; border: 1px solid #ccc; padding: 2px;}
        .dot { aspect-ratio: 1; background: #000; border-radius: 2px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎨 UnderLight Controller</h2>
    
    <label>1. Select MIDI Output Device</label>
    <select id="midi-out-select"><option>Scanning for devices...</option></select>
    
    <label>2. Global Brightness (0-255)</label>
    <div class="brightness-ctrl">
        <input type="range" id="bright-range" min="0" max="255" value="255">
        <span id="bright-val">255</span>
        <button id="apply-bright-btn" class="btn-small">Apply</button>
    </div>

    <label>3. Upload Target Palette</label>
    <select id="target-ch">
        <option value="0">User Palette 1 (CH 4)</option>
        <option value="1">User Palette 2 (CH 5)</option>
        <option value="2">User Palette 3 (CH 6)</option>
    </select>

    <label>4. Select Palette File</label>
    <div class="file-upload-wrapper">
        <label for="file-input" class="custom-file-upload" id="file-label">Click to choose a file...</label>
        <input type="file" id="file-input" accept=".txt">
    </div>
    
    <div id="preview-grid" class="grid"></div>

    <button id="upload-btn" disabled>Start Palette Upload</button>
</div>

<script>
    let midiOutput = null;
    let paletteData = { r: new Array(128).fill(0), g: new Array(128).fill(0), b: new Array(128).fill(0) };

    // MIDI Access Setup
    if (navigator.requestMIDIAccess) {
        navigator.requestMIDIAccess({ sysex: true }).then(access => {
            const updateDevices = () => {
                const outputs = Array.from(access.outputs.values());
                const select = document.getElementById('midi-out-select');
                select.innerHTML = '';
                if (outputs.length === 0) {
                    select.innerHTML = '<option>No devices found</option>';
                    return;
                }
                outputs.forEach((out, index) => {
                    const opt = document.createElement('option');
                    opt.value = out.id; 
                    opt.text = out.name;
                    select.appendChild(opt);
                });
                // 기본 선택 설정 (목록의 첫 번째)
                midiOutput = outputs[0];
                document.getElementById('upload-btn').disabled = false;
            };
            access.onstatechange = updateDevices;
            updateDevices();
            
            document.getElementById('midi-out-select').onchange = (e) => {
                midiOutput = access.outputs.get(e.target.value);
                console.log("Selected MIDI Output:", midiOutput.name);
            };
        }).catch(err => {
            console.error("MIDI Access Denied:", err);
            alert("브라우저에서 MIDI 권한을 허용해야 합니다.");
        });
    }

    // Brightness Control Logic
    const brightRange = document.getElementById('bright-range');
    const brightVal = document.getElementById('bright-val');
    brightRange.oninput = () => brightVal.textContent = brightRange.value;

    document.getElementById('apply-bright-btn').onclick = () => {
        if (!midiOutput) return alert("MIDI 장치를 먼저 선택하세요.");
        const val = parseInt(brightRange.value);
        
        // 📌 [수정됨] SysEx 규격 위반(127 초과)을 방지하기 위해 2바이트로 분할 전송
        const msb = (val >> 7) & 0x01;
        const lsb = val & 0x7F;
        
        try {
            midiOutput.send([0xF0, 0x7D, 0x0F, 0x00, msb, lsb, 0xF7]);
            console.log("Sent Brightness:", val);
        } catch(err) {
            console.error("Failed to send brightness:", err);
        }
    };

    // File Loading Logic
    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('file-label').textContent = `Selected: ${file.name}`;

        const reader = new FileReader();
        reader.onload = () => {
            const rawText = reader.result;
            const grid = document.getElementById('preview-grid');
            grid.innerHTML = '';
            paletteData.r.fill(0); paletteData.g.fill(0); paletteData.b.fill(0);

            // 정규식: "숫자, 숫자 숫자 숫자" 포맷을 찾음
            const regex = /(\d+),\s+(\d+)\s+(\d+)\s+(\d+)/g;
            let match;
            let foundCount = 0;
            while ((match = regex.exec(rawText)) !== null) {
                const idx = parseInt(match[1]);
                if (idx < 128) {
                    paletteData.r[idx] = Math.min(parseInt(match[2]) * 4, 255);
                    paletteData.g[idx] = Math.min(parseInt(match[3]) * 4, 255);
                    paletteData.b[idx] = Math.min(parseInt(match[4]) * 4, 255);
                    foundCount++;
                }
            }
            
            if(foundCount === 0) {
                alert("파일에서 유효한 색상 데이터를 찾지 못했습니다.\n형식(예: 0, 255 128 0)을 확인해주세요.");
            }

            for (let i = 0; i < 128; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.style.backgroundColor = `rgb(${paletteData.r[i]},${paletteData.g[i]},${paletteData.b[i]})`;
                grid.appendChild(dot);
            }
        };
        reader.readAsText(file);
    };

    // Palette Upload Logic
    document.getElementById('upload-btn').onclick = async () => {
        if (!midiOutput) return alert("MIDI 장치를 선택하세요.");
        const btn = document.getElementById('upload-btn');
        const originalText = btn.textContent;
        const targetIdx = parseInt(document.getElementById('target-ch').value);

        btn.disabled = true;
        btn.textContent = "Uploading Palette...";

        try {
            for (let type = 0; type < 3; type++) {
                const data = type === 0 ? paletteData.r : (type === 1 ? paletteData.g : paletteData.b);
                let payload = [];
                for (let i = 0; i < 128; i++) {
                    payload.push((data[i] >> 7) & 0x01);
                    payload.push(data[i] & 0x7F);
                }
                midiOutput.send([0xF0, 0x7D, targetIdx, type, ...payload, 0xF7]);
                
                // 장치가 처리할 시간을 줍니다.
                await new Promise(r => setTimeout(r, 100));
            }
            btn.textContent = "Upload Complete!";
        } catch(err) {
            console.error("Upload failed:", err);
            btn.textContent = "Upload Failed (Check Console)";
        }

        setTimeout(() => { 
            btn.disabled = false;
            btn.textContent = originalText; 
        }, 2000);
    };
</script>
</body>
</html>
